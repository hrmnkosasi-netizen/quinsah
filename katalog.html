<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Quinsah Collection - Katalog</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f4f4f5; }
        [v-cloak] { display: none !important; }
        .app-container { max-width: 480px; margin: 0 auto; background-color: #ffffff; min-height: 100vh; position: relative; box-shadow: 0 0 40px rgba(0,0,0,0.05); overflow-x: hidden; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        .animate-slide-up { animation: slide-up 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        @keyframes slide-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .img-cover { width: 100%; height: 100%; object-fit: cover; }
        .img-contain { width: 100%; height: 100%; object-fit: contain; }
    </style>
</head>
<body class="text-zinc-800 antialiased">
    <div id="app" v-cloak class="app-container">
        <!-- HEADER -->
        <header class="sticky top-0 z-30 bg-white/90 backdrop-blur-lg border-b border-zinc-100 px-5 py-4 flex items-center justify-between">
            <div class="flex flex-col">
                <span class="text-[10px] text-zinc-400 font-bold tracking-widest uppercase">Quinsah</span>
                <span class="text-xl font-extrabold text-zinc-900 tracking-tight leading-none">Katalog Produk</span>
            </div>
            <button @click="isCartOpen = true" class="relative p-2.5 bg-zinc-50 rounded-full border border-zinc-100">
                <i class="fa-solid fa-bag-shopping text-zinc-700"></i>
                <span v-if="cartCount > 0" class="absolute -top-1 -right-1 bg-red-600 text-white text-[10px] font-bold w-5 h-5 flex items-center justify-center rounded-full">{{ cartCount }}</span>
            </button>
        </header>

        <!-- KONTEN -->
        <main class="px-5 py-6 pb-28">
            <div class="mb-6 relative rounded-2xl overflow-hidden bg-zinc-900 text-white shadow-xl h-40">
                <img src="https://images.unsplash.com/photo-1490481651871-ab68de25d43d?q=80&w=800&auto=format&fit=crop" class="w-full h-full object-cover opacity-60">
                <div class="absolute inset-0 p-5 flex flex-col justify-center">
                    <h2 class="text-xl font-black leading-tight">Temukan Gaya<br>Terbaikmu</h2>
                </div>
            </div>

            <input type="text" v-model="searchQuery" placeholder="Cari produk..." class="w-full mb-6 px-4 py-3 bg-zinc-50 border border-zinc-200 rounded-2xl text-sm focus:outline-none">
            
            <div class="mb-6 flex overflow-x-auto gap-2.5 pb-2 scrollbar-hide -mx-5 px-5">
                <button @click="selectCategory('')" :class="selectedCategory === '' ? 'bg-zinc-900 text-white' : 'bg-white text-zinc-600 border'" class="px-5 py-2.5 rounded-full border text-sm font-semibold">Semua</button>
                <button v-for="cat in categories" :key="cat.id" @click="selectCategory(cat.name || cat.nama)" :class="selectedCategory === (cat.name || cat.nama) ? 'bg-zinc-900 text-white' : 'bg-white text-zinc-600 border'" class="px-5 py-2.5 rounded-full border text-sm font-semibold whitespace-nowrap">{{ cat.name || cat.nama }}</button>
            </div>

            <div class="grid grid-cols-2 gap-4">
                <div v-for="prod in filteredProducts" :key="prod.id" @click="openProductDetail(prod)" class="bg-white rounded-2xl border border-zinc-100 shadow-sm overflow-hidden cursor-pointer active:scale-[0.97] transition-all">
                    <div class="aspect-square w-full bg-zinc-100 flex items-center justify-center">
                        <img v-if="prod.displayImage" :src="prod.displayImage" class="img-cover">
                        <i v-else class="fa-solid fa-image text-zinc-300 text-3xl"></i>
                    </div>
                    <div class="p-3"><h3 class="text-xs font-bold text-zinc-800 line-clamp-1">{{ prod.name }}</h3><p class="text-sm font-black text-red-600 mt-1">Rp{{ formatRupiah(prod.price) }}</p></div>
                </div>
            </div>
        </main>

        <!-- MODAL DETAIL -->
        <div v-if="selectedProduct" class="fixed inset-0 z-50 flex items-end justify-center">
            <div class="absolute inset-0 bg-zinc-900/60 backdrop-blur-sm" @click="closeProductDetail"></div>
            <div class="relative w-full max-w-[480px] bg-white rounded-t-[32px] max-h-[90vh] overflow-y-auto animate-slide-up pb-10">
                <img :src="selectedProduct.displayImage" class="w-full h-64 object-cover">
                <div class="p-6">
                    <h2 class="text-2xl font-black text-zinc-900 mb-1">{{ selectedProduct.name }}</h2>
                    <p class="text-xl font-bold text-red-600 mb-4">Rp{{ formatRupiah(selectedProduct.price) }}</p>
                    <h3 class="text-[10px] font-bold text-zinc-400 uppercase tracking-widest mb-2">Varian</h3>
                    <div class="flex gap-2 mb-6">
                        <button v-for="v in selectedProduct.variants" :key="v" @click="activeVariant = v" :class="activeVariant === v ? 'bg-zinc-900 text-white' : 'bg-zinc-100'" class="px-4 py-2 rounded-lg text-xs font-bold">{{ v }}</button>
                    </div>
                    <button @click="addToCartFromDetail" class="w-full bg-zinc-900 text-white py-4 rounded-2xl font-bold text-sm">Masukkan Keranjang</button>
                </div>
            </div>
        </div>

        <!-- MODAL KERANJANG -->
        <div v-if="isCartOpen" class="fixed inset-0 z-50 flex justify-center">
            <div class="absolute inset-0 bg-zinc-900/60 backdrop-blur-sm" @click="isCartOpen = false"></div>
            <div class="relative w-full max-w-[480px] bg-zinc-50 mt-auto rounded-t-[32px] h-[85vh] flex flex-col animate-slide-up overflow-hidden">
                <div class="p-5 bg-white border-b flex items-center justify-between rounded-t-[32px]"><h2 class="font-bold">Keranjang</h2><button @click="isCartOpen = false"><i class="fa-solid fa-xmark"></i></button></div>
                <div class="flex-1 overflow-y-auto p-5 space-y-4">
                    <div v-for="(item, idx) in cart" :key="idx" class="flex gap-4 bg-white p-3 rounded-2xl shadow-sm">
                        <div class="w-16 h-16 bg-zinc-100 rounded-xl overflow-hidden"><img :src="item.displayImage" class="img-cover"></div>
                        <div class="flex-1">
                            <h4 class="text-xs font-bold">{{ item.name }}</h4>
                            <div class="flex justify-between mt-2 text-sm font-bold"><span>Rp{{ formatRupiah(item.price) }}</span><div class="flex gap-2 text-xs"><button @click="updateQty(idx, -1)">-</button><span>{{ item.qty }}</span><button @click="updateQty(idx, 1)">+</button></div></div>
                        </div>
                    </div>
                </div>
                <div class="p-5 bg-white border-t"><button @click="checkoutWhatsApp" class="w-full bg-green-500 text-white py-4 rounded-2xl font-bold">Checkout via WhatsApp</button></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { createApp } from "https://unpkg.com/vue@3/dist/vue.esm-browser.js";

        const firebaseConfig = { apiKey: "AIzaSyBvwkhhUoFOMoKTPL4TWTCJxlx0AXoA3t4", authDomain: "quinsahcollection-36926.firebaseapp.com", projectId: "quinsahcollection-36926" };
        const db = getFirestore(initializeApp(firebaseConfig));
        const COMPANY_ID = new URLSearchParams(window.location.search).get('company') || '';

        createApp({
            data() { return { products: [], categories: [], cart: [], searchQuery: '', selectedCategory: '', isCartOpen: false, selectedProduct: null, activeVariant: null } },
            computed: {
                filteredProducts() { return this.products.filter(p => p.name.toLowerCase().includes(this.searchQuery.toLowerCase()) && (!this.selectedCategory || p.category === this.selectedCategory)); },
                cartCount() { return this.cart.reduce((s, i) => s + i.qty, 0); },
                cartTotal() { return this.cart.reduce((s, i) => s + (i.price * i.qty), 0); }
            },
            async mounted() {
                if(!COMPANY_ID) return;
                const [catSnap, prodSnap] = await Promise.all([
                    getDocs(query(collection(db, "categories"), where("companyId", "==", COMPANY_ID))),
                    getDocs(query(collection(db, "products"), where("companyId", "==", COMPANY_ID)))
                ]);
                this.categories = catSnap.docs.map(d => ({id: d.id, ...d.data()}));
                this.products = prodSnap.docs.map(d => {
                    const data = d.data();
                    return {
                        id: d.id, ...data,
                        name: data.name || data.nama || 'Produk',
                        price: Number(data.sellPrice || data.price || 0),
                        displayImage: data.imageBase64 || data.imageUrl || data.foto || data.gambar || '',
                        variants: (data.variants || []).map(v => typeof v === 'object' ? v.name : v)
                    };
                });
            },
            methods: {
                selectCategory(c) { this.selectedCategory = c; },
                openProductDetail(p) { this.selectedProduct = p; this.activeVariant = p.variants[0] || null; },
                closeProductDetail() { this.selectedProduct = null; },
                addToCartFromDetail() { this.cart.push({ ...this.selectedProduct, qty: 1, variant: this.activeVariant }); this.closeProductDetail(); },
                updateQty(i, d) { this.cart[i].qty += d; if(this.cart[i].qty <= 0) this.cart.splice(i, 1); },
                formatRupiah(v) { return new Intl.NumberFormat('id-ID').format(v); },
                checkoutWhatsApp() {
                    let msg = "Order Baru:\n" + this.cart.map(i => `${i.name} (${i.variant || 'Default'}) x${i.qty}`).join('\n');
                    window.open(`https://wa.me/628123456789?text=${encodeURIComponent(msg)}`);
                }
            }
        }).mount('#app');
    </script>
</body>
</html>
